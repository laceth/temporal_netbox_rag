apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-rag-frontend
  namespace: netbox
  labels:
    app: netbox-rag-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbox-rag-frontend
  template:
    metadata:
      labels:
        app: netbox-rag-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/laceth/netbox-rag-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE
              value: http://netbox-rag-backend.netbox.svc.cluster.local:8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /netops
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-rag-frontend
  namespace: netbox
spec:
  type: NodePort
  selector:
    app: netbox-rag-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30380
